name: Hugo POC

# Builds the Hugo proof of concept in hugo-poc/ on pull requests, alongside
# the Jekyll build in ci.yml. Nothing here deploys. It also runs the redirect
# drift check, so the daily archives bump flags any new redirect_from that
# _data/redirects.csv lacks.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  HUGO_VERSION: 0.169.0

jobs:
  build:
    name: Build Hugo POC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ARCHIVE-COMPAT(redirect-from): remove once the archives drop
      # redirect_from and _data/redirects.csv is the only source.
      - name: Check redirects.csv covers the archives
        run: make check-redirects

      - name: Install Hugo
        run: |
          wget -q -O "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
          hugo version

      # Hugo keeps processed images in resources/_gen and skips any it
      # already has, so a warm cache makes the build about 1s instead of
      # about 14s.
      - name: Cache processed images
        uses: actions/cache@v4
        with:
          path: hugo-poc/resources/_gen
          key: hugo-gen-${{ env.HUGO_VERSION }}-${{ hashFiles('archives/images/**', 'hugo-poc/layouts/_partials/picture.html', 'hugo-poc/layouts/_partials/event-image.html') }}
          restore-keys: |
            hugo-gen-${{ env.HUGO_VERSION }}-

      - name: Build Hugo site
        working-directory: hugo-poc
        run: hugo --gc --templateMetrics

      - name: Check built output
        run: python3 hugo-poc/check_output.py

      # Uses the runner's Chrome rather than downloading one for Puppeteer.
      - name: Accessibility check (Pa11y)
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8080 -d hugo-poc/public >/dev/null 2>&1 &
          curl -s --retry 10 --retry-connrefused -o /dev/null http://localhost:8080/
          npx --yes pa11y-ci@4.1.1 --config hugo-poc/.pa11yci.json

      - name: Upload built site artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-poc-site
          path: hugo-poc/public/
          retention-days: 1
          if-no-files-found: error
