# Hugo proof of concept for civictech.ca: meetup and person pages only.
# Content is mounted read-only from the archives submodule; nothing there is modified.
baseURL = "https://civictech.ca/"
title = "Civic Tech Toronto"
locale = "en"
timeZone = "America/Toronto"
# Jekyll builds with `future: true`; some organizations carry future dates.
buildFuture = true

# Some person files carry Obsidian `aliases` (alternate names, not URLs),
# which Jekyll ignores.
disableAliases = true
# Rendered: every collection's pages, the redirects, and the tag and category
# pages that `make generate` produces for Jekyll. The home page is kept only
# for the _redirects output below.
disableKinds = ["section", "rss", "sitemap", "robotstxt"]

[taxonomies]
tag = "tags"
category = "categories"

[outputs]
home = ["redirects"]

[mediaTypes."text/redirects"]
delimiter = ""

[outputFormats.redirects]
mediaType = "text/redirects"
baseName = "_redirects"
isPlainText = true
notAlternative = true

# Jekyll uses `published: false` to unpublish a page; Hugo would read it as a
# publish date, so only publishDate is accepted here.
[frontmatter]
publishDate = ["publishDate"]

[params]
description = "Civic Tech Toronto is a vibrant and diverse community of Torontonians engaged in understanding and creating solutions for civic challenges through technology, design, and other innovative means."
editBase = "https://github.com/CivicTechTO/archives"
editBranch = "main"

# Tags and categories are namespaced ("topic/open-data"), and each namespace
# gets an index page at /tags/<namespace>/. Jekyll derived these lists with
# shell scripts; here they are explicit, and the build fails on a namespace
# that isn't listed (see _partials/namespaces.html).
[params.namespaces]
tags = ["topic", "type"]
categories = ["contributors", "format", "meta", "role", "status", "venue-category"]

[permalinks.page]
events = "/events/:contentbasename/"
people = "/people/:contentbasename/"
projects = "/projects/:contentbasename/"
venues = "/venues/:contentbasename/"
organizations = "/organizations/:contentbasename/"
announcements = "/announcements/:contentbasename/"
resources = "/resources/:contentbasename/"

[imaging]
jpeg.quality = 75
webp.quality = 75

[[module.mounts]]
source = "../archives/_meetups"
target = "content/events"
# Jekyll skips 390.md (published: false); Hugo has no equivalent key.
files = ["! 390.md"]
[[module.mounts]]
source = "../archives/_people"
target = "content/people"
[[module.mounts]]
source = "../archives/_projects"
target = "content/projects"
# Its `date: 2027-02-29` does not exist and is a fatal error in Hugo. No
# meetup or person references it, so leaving it out changes no rendered page.
files = ["! Weather Report Card.md"]
[[module.mounts]]
source = "../archives/_venues"
target = "content/venues"
[[module.mounts]]
source = "../archives/_organizations"
target = "content/organizations"
[[module.mounts]]
source = "../archives/_announcements"
target = "content/announcements"
[[module.mounts]]
source = "../archives/_resources"
target = "content/resources"
[[module.mounts]]
source = "content"
target = "content"
[[module.mounts]]
source = "../archives/images/events"
target = "assets/images/events"
[[module.mounts]]
source = "../_includes/icons"
target = "assets/icons"
[[module.mounts]]
source = "../_includes/logo.svg"
target = "assets/logo.svg"
[[module.mounts]]
source = "../_data"
target = "data"
# Hugo data files must be maps; the CSV is read as an asset instead.
files = ["! redirects.csv"]
[[module.mounts]]
source = "../_data/redirects.csv"
target = "assets/redirects.csv"
[[module.mounts]]
source = "../assets/css"
target = "static/assets/css"
[[module.mounts]]
source = "../assets/js"
target = "static/assets/js"
[[module.mounts]]
source = "../assets/images"
target = "static/assets/images"
[[module.mounts]]
source = "layouts"
target = "layouts"
[[module.mounts]]
source = "../_data/footer_social.yml"
target = "assets/data-raw/footer_social.yml"
# Raw sources, read for the front matter order of `social` maps.
[[module.mounts]]
source = "../archives/_people"
target = "assets/sources/people"
[[module.mounts]]
source = "../archives/_projects"
target = "assets/sources/projects"
files = ["! Weather Report Card.md"]
[[module.mounts]]
source = "../archives/_organizations"
target = "assets/sources/organizations"

# kramdown (Jekyll) leaves bare URLs as text and passes raw HTML through.
[markup.goldmark.extensions]
linkify = false
[markup.goldmark.renderer]
unsafe = true
