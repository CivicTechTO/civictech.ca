# Hugo proof of concept for civictech.ca: meetup and person pages only.
# Content is mounted read-only from the archives submodule; nothing there is modified.
baseURL = "https://civictech.ca/"
title = "Civic Tech Toronto"
locale = "en"
timeZone = "America/Toronto"
# Jekyll builds with `future: true`; some organizations carry future dates.
buildFuture = true

# Some person files carry Obsidian `aliases` (alternate names, not URLs),
# which Jekyll ignores.
disableAliases = true
# Rendered: every page of the Jekyll site, the redirects, the sitemap and
# robots.txt. The home page also writes feed.xml, generate-csv.csv and the
# host-level _redirects file (output formats below).
disableKinds = ["rss"]
enableRobotsTXT = true

# The redirect stubs (/hacknights/99/, /2017/07/05/…) imply sections that
# have no page of their own.
[[cascade]]
  [cascade.build]
    render = "never"
    list = "never"
  [cascade.target]
    kind = "section"
    path = "{/hacknights,/20[0-9][0-9]}"

[taxonomies]
tag = "tags"
category = "categories"

[outputs]
home = ["html", "feed", "wpcsv", "redirects"]

# Atom feed of the latest meetups, at /feed.xml.
[mediaTypes."application/atom+xml"]
suffixes = ["xml"]
[outputFormats.feed]
mediaType = "application/atom+xml"
baseName = "feed"
isPlainText = true
rel = "alternate"

# The WordPress import CSV of all meetups, at /generate-csv.csv.
[mediaTypes."text/csv"]
suffixes = ["csv"]
[outputFormats.wpcsv]
mediaType = "text/csv"
baseName = "generate-csv"
isPlainText = true
notAlternative = true

[mediaTypes."text/redirects"]
delimiter = ""

[outputFormats.redirects]
mediaType = "text/redirects"
baseName = "_redirects"
isPlainText = true
notAlternative = true

# Jekyll uses `published: false` to unpublish a page; Hugo would read it as a
# publish date, so only publishDate is accepted here.
[frontmatter]
publishDate = ["publishDate"]

[params]
description = "Civic Tech Toronto is a vibrant and diverse community of Torontonians engaged in understanding and creating solutions for civic challenges through technology, design, and other innovative means."
editBase = "https://github.com/CivicTechTO/archives"
editBranch = "main"
authorName = "Civic Tech Toronto"
authorEmail = "hi@civictech.ca"
# Entries in feed.xml, as `feed.limit` in Jekyll's _config.yml.
feedLimit = 25
# Written into feedback.md's script; CI sets it from the FEEDBACK_TOKEN
# secret via the HUGO_PARAMS_FEEDBACKTOKEN environment variable.
feedbackToken = ""

# Tags and categories are namespaced ("topic/open-data"), and each namespace
# gets an index page at /tags/<namespace>/. Jekyll derived these lists with
# shell scripts; here they are explicit, and the build fails on a namespace
# that isn't listed (see _partials/namespaces.html).
[params.namespaces]
tags = ["topic", "type"]
categories = ["contributors", "format", "meta", "role", "status", "venue-category"]

[permalinks.page]
events = "/events/:contentbasename/"
people = "/people/:contentbasename/"
projects = "/projects/:contentbasename/"
venues = "/venues/:contentbasename/"
organizations = "/organizations/:contentbasename/"
announcements = "/announcements/:contentbasename/"
resources = "/resources/:contentbasename/"

# Allow HTML content files (feedback.html, below). Raw HTML in Markdown is
# already passed through (`unsafe = true`), and all content is first-party.
[security]
allowContent = ['! ^text/org$']

[imaging]
jpeg.quality = 75
webp.quality = 75

[[module.mounts]]
source = "../archives/_meetups"
target = "content/events"
# Jekyll skips 390.md (published: false); Hugo has no equivalent key.
files = ["! 390.md"]
[[module.mounts]]
source = "../archives/_people"
target = "content/people"
[[module.mounts]]
source = "../archives/_projects"
target = "content/projects"
# Its `date: 2027-02-29` does not exist and is a fatal error in Hugo. No
# meetup or person references it, so leaving it out changes no rendered page.
files = ["! Weather Report Card.md"]
[[module.mounts]]
source = "../archives/_venues"
target = "content/venues"
[[module.mounts]]
source = "../archives/_organizations"
target = "content/organizations"
[[module.mounts]]
source = "../archives/_announcements"
target = "content/announcements"
[[module.mounts]]
source = "../archives/_resources"
target = "content/resources"
[[module.mounts]]
source = "content"
target = "content"
# Site pages without Liquid are used as they are. about-us.md (Liquid loops)
# has a shortcode version in content/, and index.md and list-*.md are
# templates in layouts/.
[[module.mounts]]
source = "../_pages"
target = "content"
files = ["code-of-conduct.md", "get-involved.md"]
# feedback.md is HTML in a .md file. Its indented form markup after blank
# lines would be code blocks in CommonMark, so it's mounted as HTML content.
[[module.mounts]]
source = "../_pages/feedback.md"
target = "content/feedback.html"
[[module.mounts]]
source = "../archives/images/events"
target = "assets/images/events"
[[module.mounts]]
source = "../_includes/icons"
target = "assets/icons"
[[module.mounts]]
source = "../_includes/logo.svg"
target = "assets/logo.svg"
[[module.mounts]]
source = "../_data"
target = "data"
# Hugo data files must be maps; the CSV is read as an asset instead.
files = ["! redirects.csv"]
[[module.mounts]]
source = "../_data/redirects.csv"
target = "assets/redirects.csv"
[[module.mounts]]
source = "../assets/css"
target = "static/assets/css"
[[module.mounts]]
source = "../assets/js"
target = "static/assets/js"
[[module.mounts]]
source = "../assets/images"
target = "static/assets/images"
# Organization logos, also as resources so og:image can check they exist.
[[module.mounts]]
source = "../assets/images/organizations"
target = "assets/org-logos"
[[module.mounts]]
source = "../llms.txt"
target = "static/llms.txt"
[[module.mounts]]
source = "layouts"
target = "layouts"
[[module.mounts]]
source = "../_data/footer_social.yml"
target = "assets/data-raw/footer_social.yml"
# Raw sources, read for the front matter order of `social` maps.
[[module.mounts]]
source = "../archives/_people"
target = "assets/sources/people"
[[module.mounts]]
source = "../archives/_projects"
target = "assets/sources/projects"
files = ["! Weather Report Card.md"]
[[module.mounts]]
source = "../archives/_organizations"
target = "assets/sources/organizations"

# kramdown (Jekyll) leaves bare URLs as text and passes raw HTML through.
[markup.goldmark.extensions]
linkify = false
[markup.goldmark.renderer]
unsafe = true
