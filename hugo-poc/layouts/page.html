{{ define "main" }}
  {{- /* Site pages, like Jekyll's _layouts/page.html. */}}
  <nav aria-label="breadcrumb">
    <ul>
      <li><a href="/">Home</a></li>
      <li>{{ .Title }}</li>
    </ul>
  </nav>

  <article class="mobilenegativemargin">
    <header>
      <hgroup>
        <h1>{{ .Params.display_title | default .Title }}</h1>
        {{- with .Params.summary }}
          <p>{{ . }}</p>
        {{- end }}
      </hgroup>
    </header>

    <section class="page-content">
      {{ partial "content.html" . }}
    </section>
  </article>
{{ end }}
