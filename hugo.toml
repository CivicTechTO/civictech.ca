# Hugo configuration for civictech.ca. Content is mounted read-only from
# the archives submodule; nothing there is modified.
#
# Workarounds are labelled where they live, and listed in
# docs/hugo-migration.md:
#   ARCHIVE-COMPAT(<id>)     works around archive data; remove once the
#                            archive refactor fixes that data
#   JEKYLL-TRANSITION(<id>)  only needed while Jekyll still publishes the site
#                            or shares files with Hugo; remove at cutover
# `grep -rn 'ARCHIVE-COMPAT\|JEKYLL-TRANSITION'` finds them all.
baseURL = "https://civictech.ca/"
title = "Civic Tech Toronto"
locale = "en"
timeZone = "America/Toronto"
# Jekyll builds with `future: true`; some organizations carry future dates.
buildFuture = true

# ARCHIVE-COMPAT(obsidian-aliases): some person files use Obsidian's
# `aliases` key for alternate names. In Hugo that key means redirect URLs.
# Remove once the archive renames the key (e.g. `alternate_names`).
disableAliases = true
# Rendered: every page of the Jekyll site, the redirects, the sitemap and
# robots.txt. The home page also writes feed.xml, generate-csv.csv and the
# host-level _redirects file (output formats below).
disableKinds = ["rss"]
enableRobotsTXT = true

# The redirect stubs (/hacknights/99/, /2017/07/05/…) imply sections that
# have no page of their own.
[[cascade]]
  [cascade.build]
    render = "never"
    list = "never"
  [cascade.target]
    kind = "section"
    path = "{/hacknights,/20[0-9][0-9]}"

[taxonomies]
tag = "tags"
category = "categories"

[outputs]
home = ["html", "feed", "wpcsv", "redirects"]

# Atom feed of the latest meetups, at /feed.xml.
[mediaTypes."application/atom+xml"]
suffixes = ["xml"]
[outputFormats.feed]
mediaType = "application/atom+xml"
baseName = "feed"
isPlainText = true
rel = "alternate"

# The WordPress import CSV of all meetups, at /generate-csv.csv.
[mediaTypes."text/csv"]
suffixes = ["csv"]
[outputFormats.wpcsv]
mediaType = "text/csv"
baseName = "generate-csv"
isPlainText = true
notAlternative = true

[mediaTypes."text/redirects"]
delimiter = ""

[outputFormats.redirects]
mediaType = "text/redirects"
baseName = "_redirects"
isPlainText = true
notAlternative = true

[params]
description = "Civic Tech Toronto is a vibrant and diverse community of Torontonians engaged in understanding and creating solutions for civic challenges through technology, design, and other innovative means."
editBase = "https://github.com/CivicTechTO/archives"
editBranch = "main"
authorName = "Civic Tech Toronto"
authorEmail = "hi@civictech.ca"
# Entries in feed.xml, as `feed.limit` in Jekyll's _config.yml.
feedLimit = 25
# Written into feedback.md's script; CI sets it from the FEEDBACK_TOKEN
# secret via the HUGO_PARAMS_FEEDBACKTOKEN environment variable.
feedbackToken = ""

# Tags and categories are namespaced ("topic/open-data"), and each namespace
# gets an index page at /tags/<namespace>/. Jekyll derived these lists with
# shell scripts; here they are explicit, and the build fails on a namespace
# that isn't listed (see _partials/namespaces.html).
[params.namespaces]
tags = ["topic", "type"]
categories = ["contributors", "format", "meta", "role", "status", "venue-category"]

[permalinks.page]
events = "/events/:contentbasename/"
people = "/people/:contentbasename/"
projects = "/projects/:contentbasename/"
venues = "/venues/:contentbasename/"
organizations = "/organizations/:contentbasename/"
announcements = "/announcements/:contentbasename/"
resources = "/resources/:contentbasename/"

# Allow HTML content files (content/feedback.html, whose indented form markup
# would become code blocks in Markdown). Raw HTML in Markdown is already
# passed through (`unsafe = true`), and all content is first-party.
[security]
allowContent = ['! ^text/org$']

[imaging]
jpeg.quality = 75
webp.quality = 75

[[module.mounts]]
source = "archives/_meetups"
target = "content/events"
# ARCHIVE-COMPAT(unpublished-flag): 390.md has `published: false`, which
# Jekyll honours but Hugo parses as a (bad) publish date. Remove once the
# archive uses `draft: true`. A new `published: false` file fails the build.
files = ["! 390.md"]
[[module.mounts]]
source = "archives/_people"
target = "content/people"
[[module.mounts]]
source = "archives/_projects"
target = "content/projects"
# ARCHIVE-COMPAT(invalid-date): `date: 2027-02-29` doesn't exist and is
# fatal in Hugo, so this project isn't built. Remove once the date is fixed.
# A new invalid date fails the build.
files = ["! Weather Report Card.md"]
[[module.mounts]]
source = "archives/_venues"
target = "content/venues"
[[module.mounts]]
source = "archives/_organizations"
target = "content/organizations"
[[module.mounts]]
source = "archives/_announcements"
target = "content/announcements"
[[module.mounts]]
source = "archives/_resources"
target = "content/resources"
[[module.mounts]]
source = "content"
target = "content"
[[module.mounts]]
source = "archives/images/events"
target = "assets/images/events"
[[module.mounts]]
source = "assets"
target = "assets"
# Organization logos, also as resources so og:image can check they exist.
[[module.mounts]]
source = "static/assets/images/organizations"
target = "assets/org-logos"
# ARCHIVE-COMPAT(map-key-order): raw sources, read for the front matter
# order of `social` maps, which Hugo doesn't keep. Remove once `social` is a
# list in the archives.
[[module.mounts]]
source = "archives/_people"
target = "assets/sources/people"
[[module.mounts]]
source = "archives/_projects"
target = "assets/sources/projects"
# ARCHIVE-COMPAT(invalid-date): see the content mount above.
files = ["! Weather Report Card.md"]
[[module.mounts]]
source = "archives/_organizations"
target = "assets/sources/organizations"

# kramdown (Jekyll) leaves bare URLs as text and passes raw HTML through.
[markup.goldmark.extensions]
linkify = false
[markup.goldmark.renderer]
unsafe = true
